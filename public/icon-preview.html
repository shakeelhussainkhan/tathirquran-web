<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 40px; background: #333; display: flex; gap: 20px; flex-wrap: wrap; }
.icon { border-radius: 200px; overflow: hidden; flex-shrink: 0; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="icon" style="width:256px;height:256px;background:#0a0802;position:relative;display:flex;">
  <!-- Left cover -->
  <div style="position:absolute;left:14px;top:14px;bottom:14px;width:96px;background:linear-gradient(135deg,#2a1808,#1a1005);border-radius:12px 0 0 12px;border:1.5px solid rgba(201,162,39,0.35);display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div style="width:62px;height:62px;border:1.5px solid rgba(201,162,39,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;">
      <span style="font-family:Amiri,serif;font-size:22px;color:#c9a227;">قرآن</span>
    </div>
  </div>
  <!-- Spine -->
  <div style="position:absolute;left:110px;top:14px;bottom:14px;width:12px;background:linear-gradient(90deg,#1a1005,#c9a227 50%,#1a1005);"></div>
  <!-- Right page -->
  <div style="position:absolute;left:122px;top:14px;right:14px;bottom:14px;background:#f5e8b0;border-radius:0 12px 12px 0;padding:10px 8px;display:flex;flex-direction:column;align-items:center;overflow:hidden;">
    <div style="width:100%;background:rgba(201,162,39,0.2);border:0.5px solid rgba(201,162,39,0.4);border-radius:3px;padding:3px;text-align:center;margin-bottom:8px;">
      <span style="font-family:Amiri,serif;font-size:11px;color:#8b6520;">الفاتحة</span>
    </div>
    <div style="font-family:Amiri,serif;font-size:16px;color:#1a1005;text-align:center;direction:rtl;line-height:1.7;">ٱلْحَمْدُ لِلَّهِ</div>
    <div style="font-family:Amiri,serif;font-size:14px;color:#1a1005;text-align:center;direction:rtl;line-height:1.7;opacity:0.85;">رَبِّ ٱلْعَـٰلَمِينَ</div>
    <div style="font-family:Amiri,serif;font-size:12px;color:#1a1005;text-align:center;direction:rtl;line-height:1.7;opacity:0.7;">ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>
  </div>
</div>
<p style="color:#ccc;font-family:sans-serif;font-size:13px;width:100%;">Open this file in Chrome → right-click the icon → Inspect → Screenshot node for the 256px version. Scale up to 1024px in any image editor.</p>
</body>
</html>
